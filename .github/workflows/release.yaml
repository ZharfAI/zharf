name: release

# Push a tag such as v0.2.0 to build every binary, version.json and the install scripts, and
# attach them to a GitHub Release with SHA256SUMS.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: build
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build.sh
      - name: check the binary reports the tag
        run: ./dist/zharf-linux-amd64 version | grep -F "zharf ${GITHUB_REF_NAME#v} "
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "zharf $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
