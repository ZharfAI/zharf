name: Feature request
description: Suggest something zharf should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where zharf gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The command, flag or behaviour you have in mind. Examples help.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
