version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments are optional
        - -ST1003 # names such as "oaChatRequest" are fine
        - -ST1005 # error strings are full sentences shown to people
    misspell:
      locale: US
      ignore-rules:
        - colour
        - colours
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests read fixtures and write to recorders without checking every error.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
